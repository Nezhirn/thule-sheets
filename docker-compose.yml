name: thule-sheets

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: thule_sheets
      POSTGRES_USER: thule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thule}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thule -d thule_sheets"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      THULE_DATABASE_URL: postgresql+asyncpg://thule:${POSTGRES_PASSWORD:-thule}@postgres:5432/thule_sheets
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8010}:8000"

volumes:
  pgdata:
