[project]
name = "thule-sheets-api"
version = "0.1.0"
description = "Thule Sheets backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "pwdlib[argon2]>=0.3",
    "openpyxl>=3.1.5",
    "cryptography>=50",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
# Development defaults; production startup rejects them (validate_production).
"app/config.py" = ["S105"]
# Identifiers come from the catalog and are quoted; values are bound parameters.
"app/pg/catalog.py" = ["S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
