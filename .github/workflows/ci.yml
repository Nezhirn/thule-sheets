name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: thule_sheets
          POSTGRES_USER: thule
          POSTGRES_PASSWORD: thule
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U thule -d thule_sheets"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Create test database
        run: PGPASSWORD=thule psql -h 127.0.0.1 -p 55432 -U thule -d thule_sheets -c 'CREATE DATABASE thule_sheets_test'
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check app tests
      - name: Types
        run: mypy app --ignore-missing-imports

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build
